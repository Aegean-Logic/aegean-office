<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="184" viewBox="0 0 1120 184">
  <!-- The top of every Aegean Office Setup page (560 x 92 px, drawn at 2x), matching the banner of
       each app's own Setup: ink #0A2A3B into sea #12718C, marble #F4F2EC text, one aqua #2FC6C0
       accent. The logo is the brand kit's reversed lockup, referenced, not copied.
       generate.ps1 renders this to banner.png. -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A2A3B"/>
      <stop offset="0.55" stop-color="#0E4A62"/>
      <stop offset="1" stop-color="#12718C"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="184" fill="url(#sea)"/>
  <image x="36" y="30" width="300" height="124" xlink:href="../../../brand/aegean-logic/aegean-logic-lockup-dark.svg" preserveAspectRatio="xMinYMid meet"/>
  <text x="1080" y="100" text-anchor="end" font-family="Segoe UI Semibold, Segoe UI, sans-serif" font-weight="600" font-size="52" fill="#F4F2EC">Aegean Office</text>
  <text x="1080" y="138" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="26" fill="#2FC6C0">Setup</text>
  <rect y="178" width="1120" height="6" fill="#2FC6C0"/>
</svg>
